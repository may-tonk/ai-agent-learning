# ==============================================
# 知识库（Chroma 向量库）配置：复用实验6 已经建好的库，本项目只读不写
#
# 谁读取它：utils/config_handler.py 启动时读成字典 chroma_conf，
#           services/kb_service.py 第一次检索时用它连接 Chroma，每次检索用 k、max_distance 和 rerank 段
# 检索流程（阶段：提问时）：
#   ① 召回：用户问题 → 向量模型变成向量（config/model.yml 的 embedding 段）→ Chroma 找最近的 fetch_k 个文本块
#           → 丢掉距离 > max_distance 的
#   ② 重排：重排模型（config/model.yml 的 rerank 段）给每条打相关性分数，重新排序
#   ③ 截断：只留前 k 条，并丢掉重排分数 < min_score 的 → 交给 agent
# ==============================================

# Chroma 服务地址。留空时从环境变量 CHROMA_HOST 读（.env 里配置，当前是 Ubuntu 虚拟机 192.168.229.10）
# 为什么不写死：IP 属于「运行环境」，换电脑、换虚拟机时只改 .env，不改代码和配置
# 连不上时检查：虚拟机和 docker 里的 Chroma 是否启动；Clash 等代理是否把 192.168.* 也转发了（要设为直连）
host: ""
# Chroma 端口。环境变量 CHROMA_PORT 优先（kb_service.py 里先读环境变量）
port: 8000
# 实验6 建库用的集合名（相当于数据库里的「表名」），写错会检索不到任何东西
collection_name: agent
# 最后交给大模型几个文本块。当前 3；常用 3 ~ 8
#   开了重排：先召回 fetch_k 条，重排后只留前 k 条；没开重排：直接取向量检索的前 k 条
#   调大：给模型的资料更全，能回答更综合的问题；但 token 更多、更贵，混进无关片段的概率也更高
#   调小：更省、更聚焦，但答案可能不完整
#   每个文本块大小由实验6 建库时的切分（chunk_size）决定，块越大，k 越该调小
k: 3
# 相似度距离阈值：距离越小越相似，超过这个值的结果视为「不相关」丢掉。当前 1.2
# 为什么要有它：向量检索永远会返回 k 条，哪怕问题和知识库毫无关系，不过滤模型就会拿无关内容瞎答
# 实测（2026-10-23，qwen3-vl-embedding 1024 维）：
#   相关问题「扫地机器人总是迷路怎么办」→ 距离 0.29 ~ 0.37
#   无关问题「今天天气怎么样」          → 距离 1.03 ~ 1.15（全部 < 1.2，被当成「命中」返回了）
#   所以 1.2 偏松，建议调到 0.8 左右再观察
# 调参方法：多问几个相关 / 无关的问题，看日志里每条结果的 distance（kb_service.py 把它放在 artifact 里），
#   把阈值定在两组之间；调太小会把相关结果也丢掉，模型会回答「知识库中没有找到」
# 设为 null 可以关闭过滤（不推荐）
# 开了重排之后：真正决定「相关不相关」的是下面的 min_score（更准），max_distance 只用来提前丢掉明显无关的，可以保持宽松
max_distance: 1.2

# ---------- 重排（services/rerank_service.py 用） ----------
rerank:
  # 开关。true = 召回 → 重排 → 截断；false = 直接取向量检索前 k 条（和加重排之前完全一样，方便对比效果）
  # 关掉的场景：百炼重排接口不可用、想省钱、或者想对比「有没有重排」的回答差别
  enabled: true
  # 召回条数：向量检索先取多少条交给重排模型挑。当前 10；常用 10 ~ 30（必须 ≥ k）
  #   调大：更不容易漏掉相关资料（相关的那条可能在向量检索里排第 8），但重排要处理的文字更多，更慢、更贵一点
  #   调小（如 5）：更快，但重排可挑的余地小；等于 k 时重排只能「换顺序」，不能「换人」
  fetch_k: 10
  # 重排分数阈值：分数低于它的视为不相关，丢掉（0 ~ 1，越大越相关）
  # 为什么需要它：重排后也总会剩下 k 条，问题和知识库毫无关系时，留下的 3 条也是无关的
  # 实测（2026-10-28，gte-rerank-v2，集合 agent，每个问题召回 10 条）：
  #   相关问题（6 个）：最高分 0.47 ~ 0.82；最终留下的 3 条里最低的也有 0.169
  #     迷路 0.469｜滤网 0.694｜小户型 0.435｜拖地漏水 0.67｜续航变短 0.481｜连不上WiFi 0.817
  #   无关问题（天气、写诗、Python 读 Excel、推荐电影）：10 条候选全部 0.006
  #   所以取 0.1：在两组之间，相关的都留下，无关的全部丢掉（无关问题最终返回 0 条，模型会如实说知识库没有）
  #   对比：「今天天气怎么样」的向量距离是 1.03，max_distance=1.2 拦不住它；重排分数 0.006，这里就拦住了
  # 调参方法：看日志里「[重排] … 分数 [...]」那一行；相关结果被丢了就调小，无关结果混进来就调大
  min_score: 0.1
